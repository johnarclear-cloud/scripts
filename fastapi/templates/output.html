<!DOCTYPE html>
<html>
<head>
    <title> running configuration</title>
</head>
<body>
    <h1> OUTPUTS</h1>

        <li>{{ device }}:</li>

        <pre>

        {% endfor %}
    </pre>
    </ul>
    {% endfor %}

</html>
