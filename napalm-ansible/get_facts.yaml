- name: "using NAPALM"
  hosts: all

  tasks:
    - name: "get facts from device"
      napalm_get_facts:
        hostname: "{{ ansible_host }}"
        username: "{{ ansible_user }}"
        dev_os: "{{ napalm_platform }}"
        password: "{{ ansible_password }}"
        filter: ["facts"]
      register: result

    - name: print data
      debug: var=result.ansible_facts.napalm_facts.model